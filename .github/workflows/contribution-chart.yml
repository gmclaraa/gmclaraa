name: Atualizar gráfico de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Calcular período
        id: periodo
        run: |
          START_DATE="2026-08-26"
          TODAY=$(date -u +%Y-%m-%d)

          START=$(date -d "$START_DATE" +%s)
          END=$(date -d "$TODAY" +%s)

          PERIOD=$(( (END - START) / 86400 + 1 ))

          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Gerar gráfico
        uses: pipipi-dev/gcchart@v1
        with:
          outputs: |
            contributions.svg?period=${{ steps.periodo.outputs.period }}&granularity=day

      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E879F9&color_dots=#2a2438,#4c1d95,#6D28D9,#7C3AED,#C084FC

      - name: Publicar cobrinha
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
