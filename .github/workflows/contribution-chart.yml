
name: Atualizar gráfico de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Gerar gráfico
        uses: pipipi-dev/gcchart@v1
        with:
          outputs: |
            contributions.svg?period=49&granularity=day

